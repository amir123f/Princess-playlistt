
name: Build Princess Playlist Ultimate APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          ZIP="Princess_Playlist_Ultimate_Test_GitHub.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::Project ZIP not found"
            ls -la
            exit 1
          fi

          mkdir -p android-project
          unzip -q -o "$ZIP" -d android-project

          test -f android-project/settings.gradle
          test -f android-project/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        working-directory: android-project
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Princess-Playlist-Ultimate-APK
          path: android-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
          
